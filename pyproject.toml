[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jupyter-distributed"
version = "0.1.0"
description = "Run a selected Jupyter kernel as persistent parallel processes"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Philip Bontrager" },
]
keywords = ["jupyter", "jupyterlab", "pytorch", "jax", "distributed", "spmd"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Jupyter",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "ipykernel>=6.29",
  "jupyter-client>=8.6",
  "jupyter-server>=2.14",
  "jupyterlab>=4.2",
]

[project.urls]
Homepage = "https://github.com/pbontrager/jupyter-distributed"
Issues = "https://github.com/pbontrager/jupyter-distributed/issues"
Demos = "https://github.com/pbontrager/jupyter-distributed/tree/main/demos"

[project.optional-dependencies]
mcp = [
  "jupyter-ai-tools>=0.7.0rc0,<1",
  "jupyter-server-mcp>=0.2.2,<1",
  "jupyterlab-ai-commands>=0.4.0rc0,<1",
  "jupyterlab-commands-toolkit>=0.1.6,<1",
]

[project.entry-points."jupyter_server_mcp.tools"]
jupyter_distributed = "jupyter_distributed.mcp:TOOLS"

[dependency-groups]
dev = [
  "accelerate>=1.1",
  "build>=1.2",
  "datasets>=3",
  "ipywidgets>=8.1.9",
  "nbconvert>=7.16",
  "nbstripout>=0.9.1",
  "notebook>=7,<8",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "torch>=2.4",
  "tqdm>=4.66",
  "transformers>=5.15",
]

[tool.hatch.build.targets.wheel]
packages = ["jupyter_distributed"]
artifacts = ["jupyter_distributed/labextension/**"]

[tool.hatch.build.targets.wheel.shared-data]
"jupyter-config/jupyter_server_config.d/jupyter_distributed.json" = "etc/jupyter/jupyter_server_config.d/jupyter_distributed.json"
"jupyter_distributed/labextension" = "share/jupyter/labextensions/jupyter-distributed"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
